<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estrelinha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15101e; --bg-soft:#1e1730; --card:#241b3a;
    --purple:#9566d6; --purple-deep:#5b2f8f;
    --red:#c23a52; --white:#f6eff9; --white-dim:rgba(246,239,249,.62);
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#15101e; } }
  :root[data-theme="dark"]{ --bg:#15101e; }
  *{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px); scroll-behavior:smooth}
  body{
    margin:0; background:var(--bg); color:var(--white);
    font-family:'Cormorant Garamond',Georgia,serif;
    overflow-x:hidden;
  }
  .ui{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}
  .stars{position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.7}
  .stars span{position:absolute; width:2px; height:2px; background:var(--white); border-radius:50%; animation:brilhar 3s ease-in-out infinite}
  @keyframes brilhar{0%,100%{opacity:.15} 50%{opacity:.95}}
  .cadente{position:absolute; width:90px; height:1.5px; background:linear-gradient(90deg,var(--white),transparent); border-radius:2px; opacity:0; animation:cadente 8s linear infinite}
  @keyframes cadente{0%{transform:translate(0,0) rotate(215deg); opacity:0} 4%{opacity:1} 22%{transform:translate(-280px,280px) rotate(215deg); opacity:0} 100%{opacity:0}}

  /* ---- Capa ---- */
  #capa{
    min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; position:relative; z-index:1; padding:24px; transition:opacity .8s ease, visibility .8s;
  }
  .estrela{font-size:28px; margin-bottom:6px; display:inline-block; animation:pulsar 2.2s ease-in-out infinite}
  @keyframes pulsar{0%,100%{text-shadow:0 0 6px rgba(246,239,249,.3); transform:scale(1)} 50%{text-shadow:0 0 22px rgba(149,102,214,.9),0 0 40px rgba(194,58,82,.5); transform:scale(1.15)}}
  #verificacao .estrela{font-size:46px; margin-bottom:14px}
  .estrela.explodindo{animation:explodir .6s ease-out forwards}
  @keyframes explodir{0%{transform:scale(1)} 60%{transform:scale(5); text-shadow:0 0 90px #fff,0 0 160px var(--purple)} 100%{transform:scale(14); opacity:0}}
  #flash{position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:20; transition:opacity .5s ease}
  #flash.ativo{opacity:1}
  #verificacao{
    min-height:100svh; display:none; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; position:relative; z-index:1; padding:24px; gap:14px;
  }
  #verificacao.ativa{display:flex}
  #verificacao p{color:var(--white-dim); font-size:clamp(24px,7vw,32px); margin:0; font-family:'Cormorant Garamond',Georgia,serif}
  #senhaInput{
    font-family:inherit; font-size:18px; text-align:center; color:var(--white);
    background:var(--bg-soft); border:1px solid var(--purple); border-radius:30px; padding:12px 22px;
    width:220px; max-width:80vw;
  }
  #entrar{
    font-family:inherit; font-size:16px; color:var(--white); background:transparent;
    border:1px solid var(--red); padding:10px 28px; border-radius:30px; cursor:pointer; transition:background .3s;
  }
  #entrar:hover{background:var(--red)}
  #dica{font-size:14px; max-width:280px; color:var(--red); min-height:18px}
  footer{text-align:center; font-size:16px; color:var(--white-dim); opacity:.8; margin-top:48px; padding-top:18px; border-top:1px solid rgba(149,102,214,.25); letter-spacing:.03em}
  #capa h1{font-size:clamp(40px,10vw,76px); font-weight:500; margin:0; letter-spacing:.02em}
  #capa p{color:var(--white-dim); font-size:19px; margin:10px 0 34px}
  #abrir{
    font-family:inherit; font-size:18px; letter-spacing:.04em; color:var(--white);
    background:transparent; border:1px solid var(--purple); padding:12px 34px; border-radius:40px;
    cursor:pointer; transition:background .3s, transform .3s;
  }
  #abrir:hover{background:var(--purple-deep); transform:translateY(-2px)}
  #capa.fechada{opacity:0; visibility:hidden; height:0; min-height:0; overflow:hidden}

  main{position:relative; z-index:1; max-width:760px; margin:0 auto; padding:10vh 24px 14vh; opacity:0; transition:opacity 1s ease}
  main.visivel{opacity:1}

  section{margin-bottom:100px}
  h2{font-size:clamp(26px,5vw,34px); font-weight:500; text-align:center; margin:0 0 42px}

  /* ---- Envelopes: o cartao inteiro E o envelope, nome escrito dentro ---- */
  .envelopes{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:20px}
  .envelope{
    position:relative; aspect-ratio:3/2; width:100%;
    cursor:pointer; transition:transform .25s, filter .3s;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.3));
  }
  .envelope:hover{transform:translateY(-5px)}
  .envelope.abrindo{transform:scale(.96)}
  .icone-envelope{
    position:absolute; inset:0; width:100%; height:100%; display:block;
    color:var(--white-dim); transition:color .3s;
  }
  .icone-envelope .env-corpo{fill:var(--card); stroke:currentColor}
  .icone-envelope .env-flap{fill:none; stroke:currentColor}
  .icone-envelope .env-selo{fill:var(--red); opacity:.85}
  .envelope:hover .icone-envelope, .envelope.abrindo .icone-envelope{color:var(--red)}
  .envelope .titulo{
    position:absolute; left:50%; top:84%; transform:translate(-50%,-50%);
    width:78%; font-size:clamp(13px,3.3vw,17px); font-weight:500; line-height:1.2;
    color:var(--white); text-align:center; pointer-events:none;
  }
  .envelope.bundle .titulo{color:var(--red)}

  /* ---- Modal ---- */
  #modal{
    position:fixed; inset:0; background:rgba(10,7,16,.88); backdrop-filter:blur(3px);
    display:flex; align-items:flex-end; justify-content:center; z-index:10;
    opacity:0; visibility:hidden; transition:opacity .35s ease;
  }
  #modal.aberto{opacity:1; visibility:visible}
  .folha{
    position:relative;
    width:100%; max-width:640px; max-height:86svh; overflow-y:auto;
    background:
      repeating-linear-gradient(115deg, rgba(246,239,249,.03) 0 2px, transparent 2px 7px),
      var(--bg-soft);
    border-top:1px solid var(--purple);
    border-radius:18px 18px 0 0; padding:40px 28px calc(40px + env(safe-area-inset-bottom,0px));
    transform:translateY(24px); transition:transform .35s ease;
  }
  #modal.aberto .folha{transform:translateY(0)}
  .folha::before, .folha::after{content:'✿'; position:absolute; top:16px; font-size:16px; color:var(--red); opacity:.55}
  .folha::before{left:20px}
  .folha::after{right:20px}
  .folha h3{font-weight:500; font-size:26px; margin:0 0 6px; text-align:center}
  .folha h3::after{content:'❧'; display:block; font-size:15px; color:var(--purple); margin:6px 0 20px; text-align:center}
  .folha .texto{line-height:1.85; color:var(--white-dim); white-space:pre-wrap; font-size:clamp(18px,4.6vw,20px)}
  .grade-mini{display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:12px}
  .mini{
    position:relative; aspect-ratio:3/2; cursor:pointer; border:none; background:none; padding:0;
    transition:transform .2s;
  }
  .mini:hover, .mini.abrindo{transform:translateY(-3px) scale(.98)}
  .mini .icone-envelope{position:absolute; inset:0; width:100%; height:100%; color:var(--white-dim); transition:color .2s}
  .mini:hover .icone-envelope, .mini.abrindo .icone-envelope{color:var(--red)}
  .mini .num{
    position:absolute; left:50%; top:64%; transform:translate(-50%,-50%);
    font-family:'Cormorant Garamond',Georgia,serif; font-size:17px; color:var(--white); pointer-events:none;
  }
  .voltar{
    font-family:inherit; font-size:14px; color:var(--purple); background:none; border:none;
    cursor:pointer; margin-bottom:16px; padding:0;
  }
  #fechar{
    font-family:inherit; background:none; border:1px solid var(--white-dim); color:var(--white);
    width:36px; height:36px; border-radius:50%; cursor:pointer; float:right; font-size:16px;
  }

  /* ---- Nossa Musica ---- */
  .musica-card{
    display:flex; align-items:center; gap:18px; background:var(--card);
    border:1px solid rgba(194,58,82,.4); border-radius:14px; padding:22px;
    text-decoration:none; color:inherit; cursor:pointer; transition:border-color .3s, transform .2s;
  }
  .musica-card:hover{border-color:var(--red); transform:translateY(-3px)}
  .disco{
    flex:none; width:58px; height:58px; border-radius:50%;
    background:radial-gradient(circle,var(--bg) 0 18%, var(--red) 19% 22%, var(--purple-deep) 23% 100%);
  }
  .musica-info{flex:1; min-width:0}
  .musica-info .musica-nome{font-size:20px; display:block}
  .musica-info .musica-artista{font-family:ui-sans-serif,system-ui,sans-serif; font-size:13px; color:var(--white-dim)}
  .musica-link{
    font-family:ui-sans-serif,system-ui,sans-serif; font-size:13px; color:var(--white);
    border:1px solid var(--red); padding:9px 16px; border-radius:30px;
    white-space:nowrap; pointer-events:none;
  }
  .musica-card:hover .musica-link{background:var(--red)}

  /* ---- Capa do album (slot pra imagem) ---- */
  .capa-album{
    flex:none; width:64px; height:64px; border-radius:10px; overflow:hidden;
    background:radial-gradient(circle,var(--bg) 0 16%, var(--red) 17% 20%, var(--purple-deep) 21% 100%);
    border:1px solid rgba(194,58,82,.5);
  }
  .capa-album img{width:100%; height:100%; object-fit:cover; display:block}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<section id="capa">
  <span class="estrela">✦</span>
  <h1>Estrelinha</h1>
  <p>um lugar só nosso</p>
  <button id="abrir" class="ui">abrir</button>
</section>

<div id="flash"></div>

<section id="verificacao">
  <span class="estrela">✦</span>
  <p>Você é a Karen Cristine Pereira do Santos?</p>
  <input type="password" id="senhaInput" class="ui" placeholder="senha" inputmode="numeric" autocomplete="off">
  <button id="entrar" class="ui">entrar</button>
  <p id="dica" class="ui"></p>
</section>

<main id="main">
  <section>

      </div>

        <svg class="icone-envelope" viewBox="0 0 120 80">
          <rect x="3" y="3" width="114" height="74" rx="7" style="fill:var(--card);stroke:currentColor" stroke-width="3"/>
          <path d="M6 6 L60 48 L114 6" style="fill:none;stroke:currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="translate(51.6,41.6) scale(0.7)" style="fill:var(--red)" opacity="0.9"/>
        </svg>
        <span class="titulo">Terceiro cartão</span>
      </div>
      <div class="envelope bundle" data-carta="vinte">
        <svg class="icone-envelope" viewBox="0 0 120 80">
          <rect x="3" y="3" width="114" height="74" rx="7" style="fill:var(--card);stroke:currentColor" stroke-width="3"/>
          <path d="M6 6 L60 48 L114 6" style="fill:none;stroke:currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="translate(51.6,41.6) scale(0.7)" style="fill:var(--red)" opacity="0.9"/>
        </svg>
        <span class="titulo">20 cartinhas</span>
      </div>
      <div class="envelope" data-carta="quarta">
        <svg class="icone-envelope" viewBox="0 0 120 80">
          <rect x="3" y="3" width="114" height="74" rx="7" style="fill:var(--card);stroke:currentColor" stroke-width="3"/>
          <path d="M6 6 L60 48 L114 6" style="fill:none;stroke:currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="translate(51.6,41.6) scale(0.7)" style="fill:var(--red)" opacity="0.9"/>
        </svg>
        <span class="titulo">O motivo desse site existir</span>
      </div>
    </div>
  </section>

  <section>
    <h2>Nossa música</h2>

<script>
  // estrelas de fundo
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 50; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
    s.style.animationDuration = (2 + Math.random() * 2.5).toFixed(2) + 's';
    starsEl.appendChild(s);
  }
  // estrelas cadentes
  for (let i = 0; i < 4; i++) {
    const c = document.createElement('span');
    c.className = 'cadente';
    c.style.left = Math.random() * 70 + '%';
    c.style.top = Math.random() * 40 + '%';
    c.style.animationDelay = (Math.random() * 8).toFixed(2) + 's';
    starsEl.appendChild(c);
  }

  // TRILHA AMBIENTE: os seis MP3 ficam na mesma pasta do index.html.
  const SENHA = "27052008";
  const musicas = [
    './01-nao-te-amo.mp3',
    './02-o-amor.mp3',
    './03-coincidencias.mp3',
    './04-sinais.mp3',
    './05-super.mp3',
    './06-olhos-vermelhos.mp3'
  ];
  let faixaAtual = 0;
  let trilhaIniciada = false;
  const trilha = document.getElementById('trilha');
  trilha.volume = 0.35;
  trilha.preload = 'auto';

  function iniciarTrilha() {
    // Não reinicia a música se ela já estiver tocando.
    if (!trilha.paused && !trilha.ended) return;
    trilha.src = new URL(musicas[faixaAtual], document.baseURI).href;
    trilha.load();
    const tentativa = trilha.play();
    if (tentativa && typeof tentativa.then === 'function') {
      tentativa.then(() => {
        trilhaIniciada = true;
      }).catch((erro) => {
        console.error('Não foi possível iniciar a trilha. Confira se o MP3 existe e se o navegador permite áudio:', erro);
      });
    }
  }

  // Ao terminar cada música, toca a próxima; após a sexta, volta à primeira.
  trilha.addEventListener('ended', () => {
    faixaAtual = (faixaAtual + 1) % musicas.length;
    trilha.src = new URL(musicas[faixaAtual], document.baseURI).href;
    trilha.load();
    trilha.play().then(() => { trilhaIniciada = true; }).catch((erro) => {
      console.error('Erro ao iniciar a próxima faixa:', erro);
    });
  });

  trilha.addEventListener('error', () => {
    console.error('Erro ao carregar a faixa:', trilha.currentSrc, trilha.error);
  });

  // O primeiro clique é a primeira interação do visitante; tenta iniciar a música aqui.
  document.getElementById('abrir').addEventListener('click', () => {
    iniciarTrilha();
    document.querySelector('#capa .estrela').classList.add('explodindo');
    setTimeout(() => document.getElementById('flash').classList.add('ativo'), 450);
    setTimeout(() => {
      document.getElementById('capa').classList.add('fechada');
      document.getElementById('verificacao').classList.add('ativa');
      document.getElementById('flash').classList.remove('ativo');
    }, 950);
  });

  function verificar(){
    const valor = document.getElementById('senhaInput').value.replace(/\D/g, '');
    if (valor === SENHA) {
      // Não reinicia a música aqui: ela continua tocando durante a abertura das cartinhas.
      document.querySelector('#verificacao .estrela').classList.add('explodindo');
      setTimeout(() => document.getElementById('flash').classList.add('ativo'), 450);
      setTimeout(() => {
        document.getElementById('verificacao').classList.remove('ativa');
        document.getElementById('flash').classList.remove('ativo');
        const main = document.getElementById('main');
        main.classList.add('visivel');
        setTimeout(() => main.scrollIntoView({behavior:'smooth'}), 150);
      }, 950);
    } else {
      document.getElementById('dica').textContent = 'Você errou a senha. A senha é o nascimento da maior e mais linda estrela que eu já vi.';
    }
  }

  document.getElementById('entrar').addEventListener('click', () => {
    iniciarTrilha();
    verificar();
  });
  document.getElementById('senhaInput').addEventListener('keydown', e => { if (e.key === 'Enter') { iniciarTrilha(); verificar(); } });

  // conteudo das cartas (texto real entra aqui nas proximas versoes)
  const cartas = {
    primeira: { titulo: "Primeira carta", texto: `Karen,

Eu sinceramente acho você uma pessoa muito da hora. Eu gosto muito de você e você é uma pessoa muito importante na minha vida. Eu amo todos os momentos que a gente teve juntos. Pra mim, foram alguns dos melhores momentos que eu poderia ter vivido.

E eu espero, sinceramente, continuar aqui com você.

Infelizmente, eu tô passando por uns momentos meio ruins. Não é indiretamente por você, nem é algo que você tenha feito. É mais por tudo mesmo. O ambiente está sendo muito pesado e, às vezes, isso acaba mexendo comigo. Mas eu não quero que você pense que eu estou chateado com você. Eu não estou. Nunca estive. Às vezes eu só fico mais pensativo, tentando entender as coisas dentro da minha cabeça.

Mas, mesmo nesses momentos, eu amo o seu jeito.

Eu amo estar do seu lado. Sua luz realmente irradia. Você é uma pessoa brilhante, e eu consigo enxergar a luz que você leva para a vida das outras pessoas simplesmente sendo você.

Você foi uma das pessoas que mais mudou a minha vida. Mudou meu jeito de ser, mudou meu modo de enxergar o mundo e me mostrou coisas que eu não conseguia enxergar com tanta facilidade.

Você é a "mais mais", como você mesma fala. E eu sou o "menos menos".

Eu não sei exatamente o que o futuro vai colocar na nossa frente. Mas eu sei que sou muito grato por ter você na minha vida e por tudo que já vivemos juntos.

Porque, no fim, eu não preciso que tudo seja perfeito. Eu só gosto de ter você por perto.

E, Karen, independente de qualquer coisa que aconteça, eu espero que você nunca esqueça o quanto você é especial. Eu vejo sua luz. E espero que você nunca deixe ninguém apagar isso.

Obrigado por ser você.

Com carinho,
Gustavo` },
    segunda: { titulo: "Segunda carta", texto: `Por quê?

Porque, pra mim, o mais importante sempre foi nós dois.

Cada momento que eu passei com você, cada segundo, cada conversa, cada risada e até cada bronca que eu levei valeu a pena.

E não foi porque eu estava esperando alguma coisa em troca. Foi simplesmente porque era você.

Eu não precisava que acontecesse alguma coisa grandiosa. Às vezes, só estar do seu lado já fazia aquele momento valer a pena.

Então quando você pergunta "por quê?", essa é a resposta mais simples que eu consigo dar:

porque era você.

E, pra mim, isso sempre foi motivo suficiente.` },
    terceira: { titulo: "Terceiro cartão", texto: `Karen,

Quando eu comecei a pensar nessas vinte cartas, eu comecei lembrando de tudo que a gente já viveu, de todos os momentos, conversas e coisas pequenas que, de alguma forma, ficaram na minha cabeça. E quando eu percebi, já tinha coisa demais para colocar em uma carta só. Então eu comecei a separar tudo em partes, mas no fundo todas essas cartas vieram da mesma coisa: das lembranças que eu tenho de você e de nós dois.

  const modal = document.getElementById('modal');

  function abrirFolha(titulo, texto){
    document.getElementById('folha-titulo').textContent = titulo;
    const alvo = document.getElementById('folha-texto');
    alvo.innerHTML = '';
    alvo.textContent = texto;
    modal.classList.add('aberto');
  }

  function abrirGrade(){
    document.getElementById('folha-titulo').textContent = '20 cartinhas';
    const alvo = document.getElementById('folha-texto');
    alvo.innerHTML = '';
    const grade = document.createElement('div');
    grade.className = 'grade-mini';
    vinte.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'mini';
      b.innerHTML = `<svg class="icone-envelope" viewBox="0 0 120 80">
          <rect x="3" y="3" width="114" height="74" rx="7" style="fill:var(--card);stroke:currentColor" stroke-width="3"/>
          <path d="M6 6 L60 48 L114 6" style="fill:none;stroke:currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
        </svg><span class="num">${String(i + 1).padStart(2, '0')}</span>`;
      b.addEventListener('click', () => {
        b.classList.add('abrindo');
        setTimeout(() => abrirCartinha(i), 180);
      });
      grade.appendChild(b);
    });
    alvo.appendChild(grade);
    modal.classList.add('aberto');
  }

  function abrirCartinha(i){
    const c = vinte[i];
    document.getElementById('folha-titulo').textContent = c.titulo;
    const alvo = document.getElementById('folha-texto');
    alvo.innerHTML = '';
    alvo.textContent = c.texto;
    const voltar = document.createElement('button');
    voltar.className = 'voltar ui';
    voltar.textContent = '← voltar pras 20 cartinhas';
    voltar.addEventListener('click', abrirGrade);
    alvo.prepend(voltar);
  }

  document.querySelectorAll('.envelope').forEach(env => {
    env.addEventListener('click', () => {
      env.classList.add('abrindo');
      setTimeout(() => {
        env.classList.remove('abrindo');
        if (env.dataset.carta === 'vinte') { abrirGrade(); return; }
        const c = cartas[env.dataset.carta];
        abrirFolha(c.titulo, c.texto);
      }, 200);
    });
  });
  document.getElementById('fechar').addEventListener('click', () => modal.classList.remove('aberto'));
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('aberto'); });
